<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>닛산 GT-R 긴팔 티셔츠 디자인 · 정승원</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1a1c1c; --muted:#555; --accent:#000863; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#121314; --fg:#f1f1f1; --muted:#aaa; --accent:#bdc2ff; } }
  :root[data-theme="dark"] { --bg:#121314; --fg:#f1f1f1; --muted:#aaa; --accent:#bdc2ff; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif; line-height:1.7; }
  main { max-width:960px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:26px; margin:8px 0 4px; color:var(--accent); }
  .meta { color:var(--muted); font-size:14px; margin-bottom:20px; }
  h2 { font-size:18px; margin:32px 0 12px; border-bottom:2px solid var(--fg); padding-bottom:4px; }
  p { margin:8px 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:10px; }
  .grid img { width:100%; height:auto; display:block; border-radius:6px; background:#fff; }
  .design img { width:100%; max-width:720px; display:block; margin:0 auto; border-radius:6px; background:#fff; }
  ul { padding-left:20px; }
  li { margin:4px 0; }
</style>
</head>
<body>
<main>
  <h1>닛산 GT-R 긴팔 티셔츠 디자인</h1>
  <div class="meta">정승원 · 기획·디자인·제작 · 2026-11</div>

  <h2>디자인</h2>
  <p>스카이라인 GT-R(R34) 이미지를 등에 크게 넣고, 목 뒤에 NISMO 로고, 왼쪽 가슴에 GT-R 로고를 배치한 네이비 긴팔 티셔츠입니다.</p>
  <div class="design"><img src="design.jpg" alt="티셔츠 디자인 예상 이미지 (앞·뒤)"></div>

  <h2>제작 과정</h2>
  <ul>
    <li>여러 사진 위에 디자인을 올려 보며 그림의 크기와 위치를 시험했습니다.</li>
    <li>디자인 자료를 옷 제작 사이트 티프린스에 제출해 제작을 진행했습니다.</li>
    <li>완성된 옷을 실제로 착용해 결과를 확인했습니다.</li>
  </ul>

  <h2>완성품 · 착용 사진</h2>
  <div class="grid">
    <img src="wear01.jpg" alt="완성된 티셔츠 (정면, 바닥)">
    <img src="wear02.jpg" alt="완성된 티셔츠 (뒷면, 바닥)">
    <img src="wear03.jpg" alt="티셔츠 착용 (정면 전신)">
    <img src="wear04.jpg" alt="티셔츠 착용 (뒷면 전신)">
    <img src="wear05.jpg" alt="티셔츠 착용 (팔짱)">
    <img src="wear06.jpg" alt="티셔츠 착용 (정면)">
    <img src="wear07.jpg" alt="티셔츠 착용 (뒷면)">
  </div>
</main>
</body>
</html>
